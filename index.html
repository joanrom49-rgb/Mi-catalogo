<script>
const PAGE_SIZE = 60;
let shown = PAGE_SIZE;
let PRODUCTS = [];
let currentList = [];

// Función para obtener la URL correcta de la imagen
function getImageUrl(url) {
  if (!url) return "";
  if (url.startsWith("http://") || url.startsWith("https://")) {
    return url;
  }
  // Si viene relativa (/media/...)
  return "https://amoramarket.com.mx" + (url.startsWith("/") ? "" : "/") + url;
}

function money(n){
  return "$" + n.toLocaleString("es-MX", {minimumFractionDigits:0, maximumFractionDigits:0});
}

function normalize(s){
  return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
}

function renderPage(){
  const grid = document.getElementById("grid");
  const empty = document.getElementById("empty");
  const loadMore = document.getElementById("load-more");
  document.getElementById("result-count").textContent = currentList.length + " fragancia" + (currentList.length === 1 ? "" : "s");

  if(currentList.length === 0){
    grid.innerHTML = "";
    empty.style.display = "block";
    loadMore.style.display = "none";
    return;
  }
  empty.style.display = "none";

  const slice = currentList.slice(0, shown);
  grid.innerHTML = slice.map(p => {
    const src = getImageUrl(p.img);
    return `
      <div class="card">
        <div class="imgwrap">
          ${src
            ? `<img src="${src}" alt="${p.nombre}" loading="lazy" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
               <div class="fallback" style="display:none;">${p.nombre}</div>`
            : `<div class="fallback">${p.nombre}</div>`
          }
        </div>
        <div class="body">
          <div class="name">${p.nombre}</div>
          ${p.precio_venta ? `<div class="price">${money(p.precio_venta)}</div>` : ""}
        </div>
      </div>
    `;
  }).join("");

  loadMore.style.display = shown < currentList.length ? "block" : "none";
}

function applyFilters(){
  const q = normalize(document.getElementById("search").value.trim());
  currentList = !q ? PRODUCTS : PRODUCTS.filter(p => normalize(p.nombre).includes(q));
  shown = PAGE_SIZE;
  renderPage();
}

async function init(){
  try{
    const res = await fetch("./products.json?_=" + Date.now());
    if(!res.ok) throw new Error("No se pudo obtener el archivo products.json");
    
    PRODUCTS = await res.json();
    currentList = PRODUCTS;
    
    document.getElementById("loading").style.display = "none";
    document.getElementById("search").disabled = false;
    document.getElementById("footer").textContent =
      "Catálogo privado — " + PRODUCTS.length + " fragancias — actualizado automáticamente cada semana.";
    renderPage();
  }catch(err){
    console.error(err);
    document.getElementById("loading").textContent = "No se pudo cargar el catálogo. Intenta recargar la página.";
  }
}

document.getElementById("search").addEventListener("input", applyFilters);
document.getElementById("load-more").addEventListener("click", () => {
  shown += PAGE_SIZE;
  renderPage();
});

init();
</script>
