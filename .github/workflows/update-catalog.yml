name: Actualizar catálogo

on:
  schedule:
    # Todos los lunes a las 7:00 AM hora CDMX (13:00 UTC)
    - cron: '0 13 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install cheerio

      - name: Ejecutar scraper
        run: node scrape.js

      - name: Guardar cambios si hay productos nuevos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add products.json
          git diff --staged --quiet || git commit -m "Actualiza catálogo automáticamente"
          git push
